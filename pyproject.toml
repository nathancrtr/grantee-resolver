[project]
name = "grantee-resolver"
version = "0.1.0"
description = "Resolve terminated federal grant recipients to UEI and EIN, with provenance."
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11", "requests>=2.31", "rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grantee = "grantee_resolver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
